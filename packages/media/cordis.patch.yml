# dsh bundle layer: mount the media-generation capability (ctx.media service
# plus the generate_image / generate_video tools). Provider implementations
# (e.g. @roubaai/media-maizi) register themselves onto ctx.media.
- insert:
    - id: roubaai-media
      name: '@roubaai/media'
      inject: [tools, jobs, attachments, webServer]
